<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1280" height="540" fill="#ffffff"/>

  <!-- Run state -->
  <rect x="170" y="20" width="960" height="50" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="650" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Run state (Postgres)</text>
  <text x="650" y="59" text-anchor="middle" font-size="11" fill="#64748b">clues, candidates, tool results, human decisions · lets a run pause and resume</text>
  <g stroke="#94a3b8" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="275" y1="73" x2="275" y2="107"/>
    <line x1="525" y1="73" x2="525" y2="107"/>
    <line x1="775" y1="73" x2="775" y2="107"/>
    <line x1="1025" y1="73" x2="1025" y2="107"/>
  </g>
  <g font-size="10.5" fill="#475569">
    <text x="282" y="94">read / write</text>
    <text x="532" y="94">read / write</text>
    <text x="782" y="94">read / write</text>
    <text x="1032" y="94">read / write</text>
  </g>

  <!-- Input -->
  <rect x="20" y="210" width="110" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="75" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Photo</text>
  <text x="75" y="254" text-anchor="middle" font-size="11" fill="#64748b">input</text>

  <!-- Phase boxes -->
  <g fill="#ffffff" stroke="#334155" stroke-width="1.5">
    <rect x="170" y="110" width="210" height="260" rx="6"/>
    <rect x="420" y="110" width="210" height="260" rx="6"/>
    <rect x="670" y="110" width="210" height="260" rx="6" stroke-dasharray="6 4"/>
    <rect x="920" y="110" width="210" height="260" rx="6" stroke-dasharray="6 4"/>
  </g>
  <g fill="#f1f5f9" stroke="#334155" stroke-width="1.5">
    <path d="M170,116 a6,6 0 0 1 6,-6 h198 a6,6 0 0 1 6,6 v40 h-210 z"/>
    <path d="M420,116 a6,6 0 0 1 6,-6 h198 a6,6 0 0 1 6,6 v40 h-210 z"/>
    <path d="M670,116 a6,6 0 0 1 6,-6 h198 a6,6 0 0 1 6,6 v40 h-210 z" stroke-dasharray="6 4"/>
    <path d="M920,116 a6,6 0 0 1 6,-6 h198 a6,6 0 0 1 6,6 v40 h-210 z" stroke-dasharray="6 4"/>
  </g>
  <g text-anchor="middle">
    <text x="275" y="132" font-size="14" font-weight="700" fill="#0f172a">1. Extract</text>
    <text x="275" y="148" font-size="11" fill="#64748b">Local models · Done</text>
    <text x="525" y="132" font-size="14" font-weight="700" fill="#0f172a">2. Reason</text>
    <text x="525" y="148" font-size="11" fill="#1d4ed8">Claude agent · In progress</text>
    <text x="775" y="132" font-size="14" font-weight="700" fill="#0f172a">3. Search</text>
    <text x="775" y="148" font-size="11" fill="#64748b">Agent tools · Planned</text>
    <text x="1025" y="132" font-size="14" font-weight="700" fill="#0f172a">4. Verify</text>
    <text x="1025" y="148" font-size="11" fill="#64748b">Image similarity · Planned</text>
  </g>

  <!-- Inner steps -->
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1">
    <rect x="188" y="174" width="174" height="44" rx="4"/>
    <rect x="188" y="230" width="174" height="44" rx="4"/>
    <rect x="188" y="286" width="174" height="44" rx="4"/>

    <rect x="438" y="180" width="174" height="56" rx="4"/>
    <rect x="438" y="270" width="174" height="56" rx="4"/>

    <rect x="688" y="180" width="174" height="56" rx="4"/>
    <rect x="688" y="270" width="174" height="56" rx="4"/>

    <rect x="938" y="180" width="174" height="56" rx="4"/>
    <rect x="938" y="270" width="174" height="56" rx="4"/>
  </g>
  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <text x="275" y="194">EXIF metadata</text>
    <text x="275" y="210" font-size="11" fill="#64748b">camera, time, GPS</text>
    <text x="275" y="250">Object detection</text>
    <text x="275" y="266" font-size="11" fill="#64748b">Grounding DINO</text>
    <text x="275" y="306">Text recognition</text>
    <text x="275" y="322" font-size="11" fill="#64748b">PaddleOCR (Arabic, English)</text>

    <text x="525" y="204">Clean clues</text>
    <text x="525" y="222" font-size="11" fill="#64748b">plus close-up crops</text>
    <text x="525" y="294">Ranked candidate places</text>
    <text x="525" y="312" font-size="11" fill="#64748b">evidence, search queries</text>

    <text x="775" y="204">Map, place, web search</text>
    <text x="775" y="222" font-size="11" fill="#64748b">run the queries</text>
    <text x="775" y="294">Candidates</text>
    <text x="775" y="312" font-size="11" fill="#64748b">coordinates, reference photos</text>

    <text x="1025" y="204">Compare with references</text>
    <text x="1025" y="222" font-size="11" fill="#64748b">DINOv2 similarity</text>
    <text x="1025" y="294">Score and select</text>
    <text x="1025" y="312" font-size="11" fill="#64748b">best matching place</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)">
    <line x1="525" y1="236" x2="525" y2="267"/>
    <line x1="775" y1="236" x2="775" y2="267"/>
    <line x1="1025" y1="236" x2="1025" y2="267"/>
  </g>

  <!-- Context notes -->
  <g font-size="10.5" text-anchor="middle">
    <text x="525" y="346" font-weight="700" fill="#334155">Context</text>
    <text x="525" y="360" fill="#64748b">cleaned clues + up to 6 crops only</text>
    <text x="775" y="346" font-weight="700" fill="#334155">Context</text>
    <text x="775" y="360" fill="#64748b">old tool results summarised</text>
  </g>

  <!-- Output -->
  <rect x="1160" y="200" width="105" height="80" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="1212" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Location</text>
  <text x="1212" y="250" text-anchor="middle" font-size="10.5" fill="#cbd5e1">coordinates,</text>
  <text x="1212" y="264" text-anchor="middle" font-size="10.5" fill="#cbd5e1">confidence, reasons</text>

  <!-- Flow arrows -->
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="130" y1="240" x2="166" y2="240"/>
    <line x1="380" y1="240" x2="416" y2="240"/>
    <line x1="630" y1="240" x2="666" y2="240"/>
    <line x1="880" y1="240" x2="916" y2="240"/>
    <line x1="1130" y1="240" x2="1156" y2="240"/>
  </g>
  <g font-size="10.5" fill="#475569" text-anchor="middle">
    <text x="400" y="230">payload</text>
    <text x="650" y="230">queries</text>
    <text x="900" y="230">places</text>
  </g>

  <!-- Human in the loop -->
  <rect x="700" y="430" width="400" height="56" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="900" y="453" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Human in the loop</text>
  <text x="900" y="471" text-anchor="middle" font-size="11" fill="#64748b">approves tool use, confirms the result, can ask for a deeper search</text>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="740" y1="370" x2="740" y2="427"/>
    <line x1="810" y1="430" x2="810" y2="373"/>
    <line x1="990" y1="370" x2="990" y2="427"/>
    <line x1="1060" y1="430" x2="1060" y2="373"/>
  </g>
  <g font-size="10.5" fill="#475569">
    <text x="746" y="404">tool calls</text>
    <text x="816" y="396">approve,</text>
    <text x="816" y="410">search deeper</text>
    <text x="996" y="404">result</text>
    <text x="1066" y="404">confirm</text>
  </g>

  <!-- Footer -->
  <text x="640" y="525" text-anchor="middle" font-size="11.5" fill="#64748b">Solid border: built · Dashed border: planned · Search area narrows at each step: world, region, candidate places, one location</text>
</svg>
