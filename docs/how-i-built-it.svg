<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1280" height="470" fill="#ffffff"/>

  <text x="640" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">How I built conan</text>

  <!-- Thinking -->
  <g fill="#ffffff" stroke="#334155" stroke-width="1.5">
    <rect x="50" y="70" width="360" height="90" rx="6"/>
    <rect x="460" y="70" width="360" height="90" rx="6"/>
    <rect x="870" y="70" width="360" height="90" rx="6"/>
  </g>
  <g text-anchor="middle">
    <g font-size="16" font-weight="700" fill="#0f172a">
      <text x="230" y="106">1 · Problem</text>
      <text x="640" y="106">2 · Solution idea</text>
      <text x="1050" y="106">3 · Plan</text>
    </g>
    <g font-size="13" fill="#475569">
      <text x="230" y="134">photo → where it was taken, and why</text>
      <text x="640" y="134">solve it like a detective</text>
      <text x="1050" y="134">solid base first, then one phase at a time</text>
    </g>
  </g>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="411" y1="115" x2="457" y2="115"/>
    <line x1="821" y1="115" x2="867" y2="115"/>
    <line x1="1050" y1="161" x2="1050" y2="197"/>
  </g>

  <!-- Implementation (wrapped) -->
  <rect x="50" y="200" width="1180" height="140" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="224" font-size="13" font-weight="700" fill="#0f172a">Implementation</text>
  <text x="1210" y="224" text-anchor="end" font-size="11" fill="#64748b">solid = done · thick = now · dashed = next</text>

  <g fill="#ffffff" stroke="#334155" stroke-width="1.5">
    <rect x="70" y="245" width="165" height="70" rx="6"/>
    <rect x="265" y="245" width="165" height="70" rx="6"/>
    <rect x="460" y="245" width="165" height="70" rx="6" stroke-width="3"/>
    <rect x="655" y="245" width="165" height="70" rx="6" stroke-dasharray="6 4"/>
    <rect x="850" y="245" width="165" height="70" rx="6" stroke-dasharray="6 4"/>
    <rect x="1045" y="245" width="165" height="70" rx="6" stroke-dasharray="6 4"/>
  </g>
  <g text-anchor="middle">
    <g font-size="15" font-weight="700" fill="#0f172a">
      <text x="152" y="276">Scaffold</text>
      <text x="347" y="276">Extract</text>
      <text x="542" y="276">Reason</text>
      <text x="737" y="276">Search</text>
      <text x="932" y="276">Verify</text>
      <text x="1127" y="276">Production</text>
    </g>
    <g font-size="12" fill="#64748b">
      <text x="152" y="298">the base</text>
      <text x="347" y="298">see</text>
      <text x="542" y="298">think</text>
      <text x="737" y="298">look up</text>
      <text x="932" y="298">confirm</text>
      <text x="1127" y="298">ship</text>
    </g>
  </g>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="236" y1="280" x2="262" y2="280"/>
    <line x1="431" y1="280" x2="457" y2="280"/>
    <line x1="626" y1="280" x2="652" y2="280"/>
    <line x1="821" y1="280" x2="847" y2="280"/>
    <line x1="1016" y1="280" x2="1042" y2="280"/>
  </g>

  <!-- Loop -->
  <text x="640" y="380" text-anchor="middle" font-size="12" fill="#64748b">on every step</text>
  <g font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="340" y="420">Small step</text>
    <text x="540" y="420">Build</text>
    <text x="740" y="420">Run on real photo</text>
    <text x="940" y="420">Measure</text>
  </g>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="388" y1="415" x2="505" y2="415"/>
    <line x1="575" y1="415" x2="670" y2="415"/>
    <line x1="810" y1="415" x2="895" y2="415"/>
  </g>
  <path d="M985,415 h40 v30 h-725" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="300" y1="445" x2="300" y2="425" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
