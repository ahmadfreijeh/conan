<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1280" height="480" fill="#ffffff"/>

  <text x="640" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">How I built conan</text>

  <!-- Thinking -->
  <g fill="#ffffff" stroke="#334155" stroke-width="1.5">
    <rect x="50" y="70" width="212" height="100" rx="6"/>
    <rect x="292" y="70" width="212" height="100" rx="6"/>
    <rect x="534" y="70" width="212" height="100" rx="6"/>
    <rect x="776" y="70" width="212" height="100" rx="6"/>
    <rect x="1018" y="70" width="212" height="100" rx="6"/>
  </g>
  <g text-anchor="middle">
    <g font-size="15" font-weight="700" fill="#0f172a">
      <text x="156" y="104">1 · Spark</text>
      <text x="398" y="104">2 · Study</text>
      <text x="640" y="104">3 · Research</text>
      <text x="882" y="104">4 · Idea</text>
      <text x="1124" y="104">5 · Plan</text>
    </g>
    <g font-size="12" fill="#475569">
      <text x="156" y="130">a guessnotlost reel: finding</text>
      <text x="156" y="148">where photos were taken</text>
      <text x="398" y="130">his method: spot clues,</text>
      <text x="398" y="148">link them, then check</text>
      <text x="640" y="130">what tools exist</text>
      <text x="640" y="148">for each of his steps</text>
      <text x="882" y="130">teach an agent</text>
      <text x="882" y="148">the same method</text>
      <text x="1124" y="130">solid base first,</text>
      <text x="1124" y="148">then one phase at a time</text>
    </g>
  </g>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="263" y1="120" x2="289" y2="120"/>
    <line x1="505" y1="120" x2="531" y2="120"/>
    <line x1="747" y1="120" x2="773" y2="120"/>
    <line x1="989" y1="120" x2="1015" y2="120"/>
    <line x1="1124" y1="171" x2="1124" y2="207"/>
  </g>

  <!-- Implementation (wrapped) -->
  <rect x="50" y="210" width="1180" height="140" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="234" font-size="13" font-weight="700" fill="#0f172a">Implementation</text>
  <text x="1210" y="234" text-anchor="end" font-size="11" fill="#64748b">solid = done · thick = now · dashed = next</text>

  <g fill="#ffffff" stroke="#334155" stroke-width="1.5">
    <rect x="70" y="255" width="165" height="70" rx="6"/>
    <rect x="265" y="255" width="165" height="70" rx="6"/>
    <rect x="460" y="255" width="165" height="70" rx="6" stroke-width="3"/>
    <rect x="655" y="255" width="165" height="70" rx="6" stroke-dasharray="6 4"/>
    <rect x="850" y="255" width="165" height="70" rx="6" stroke-dasharray="6 4"/>
    <rect x="1045" y="255" width="165" height="70" rx="6" stroke-dasharray="6 4"/>
  </g>
  <g text-anchor="middle">
    <g font-size="15" font-weight="700" fill="#0f172a">
      <text x="152" y="286">Scaffold</text>
      <text x="347" y="286">Extract</text>
      <text x="542" y="286">Reason</text>
      <text x="737" y="286">Search</text>
      <text x="932" y="286">Verify</text>
      <text x="1127" y="286">Production</text>
    </g>
    <g font-size="12" fill="#64748b">
      <text x="152" y="308">the base</text>
      <text x="347" y="308">spot clues</text>
      <text x="542" y="308">link them</text>
      <text x="737" y="308">look up</text>
      <text x="932" y="308">check</text>
      <text x="1127" y="308">ship</text>
    </g>
  </g>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="236" y1="290" x2="262" y2="290"/>
    <line x1="431" y1="290" x2="457" y2="290"/>
    <line x1="626" y1="290" x2="652" y2="290"/>
    <line x1="821" y1="290" x2="847" y2="290"/>
    <line x1="1016" y1="290" x2="1042" y2="290"/>
  </g>

  <!-- Loop -->
  <text x="640" y="390" text-anchor="middle" font-size="12" fill="#64748b">on every step</text>
  <g font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="340" y="430">Small step</text>
    <text x="540" y="430">Build</text>
    <text x="740" y="430">Run on real photo</text>
    <text x="940" y="430">Measure</text>
  </g>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="388" y1="425" x2="505" y2="425"/>
    <line x1="575" y1="425" x2="670" y2="425"/>
    <line x1="810" y1="425" x2="895" y2="425"/>
  </g>
  <path d="M985,425 h40 v30 h-725" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="300" y1="455" x2="300" y2="435" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
